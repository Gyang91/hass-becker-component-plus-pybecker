; Lives in tests/ on purpose: it makes pytest's rootdir the tests folder,
; keeping the repository root (which contains the integration's __init__.py,
; HACS content_in_root layout) out of the collection tree. With the root in
; the tree, pytest would try to import that __init__.py as a package init.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
; Home Assistant aliases httpx to httpx2 on import; respx's plugin would
; import httpx first and break that, so it stays off (respx itself still works).
addopts = -p no:respx
