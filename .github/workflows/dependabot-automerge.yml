name: Dependabot auto-merge

# Merge Dependabot pull requests on their own once every check is green.
# Dependabot only updates test tools and workflow actions here (`chore(deps)`,
# `ci(deps)`), so a merge never publishes a release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge once all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number,author,headRefOid \
            --jq ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | .number")
          if [ -z "$PR" ]; then
            echo "No open Dependabot pull request for $BRANCH at $SHA"
            exit 0
          fi
          # Wait for the other checks (HACS, hassfest) and stop on any failure.
          gh pr checks "$PR" --repo "$REPO" --watch --interval 20 --fail-fast
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
