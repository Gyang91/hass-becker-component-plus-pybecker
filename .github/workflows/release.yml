name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # approve the release pull request's checks
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release without a manual merge: when release-please opened or updated
      # its pull request, test that branch, merge it, and run release-please
      # again to tag the release. A merge made with GITHUB_TOKEN starts no new
      # workflow run, so tagging has to happen in this one. HACS installs the
      # integration straight from the tag, so no release asset is needed.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: actions/setup-python@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Test the release branch
        if: ${{ steps.release.outputs.pr }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          python -m compileall -q .
          pytest -c tests/pytest.ini tests
      # Checks on a pull request opened by github-actions[bot] can wait for
      # approval and expire as failed once it is merged: approve them.
      - name: Approve the release pull request's checks
        if: ${{ steps.release.outputs.pr }}
        # env is evaluated even when the step is skipped: pass the raw output
        # and parse it in the script (fromJSON('') would fail every run).
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r .headBranchName <<<"$PR")
          for id in $(gh api "repos/${{ github.repository }}/actions/runs?branch=$BRANCH&status=action_required" --jq '.workflow_runs[].id'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" || echo "Could not approve run $id"
          done
      - name: Merge the release pull request
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ fromJSON(steps.release.outputs.pr).number }}" --squash --repo "${{ github.repository }}"
      - uses: googleapis/release-please-action@v5
        if: ${{ steps.release.outputs.pr }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
